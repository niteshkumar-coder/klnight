    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var win = window;
          var proto = Object.getPrototypeOf(win) || win;
          var desc = Object.getOwnPropertyDescriptor(win, 'fetch') || Object.getOwnPropertyDescriptor(proto, 'fetch');
          if (desc && !desc.set) {
            var origFetch = win.fetch.bind(win);
            Object.defineProperty(win, 'fetch', {
              get: function() { return origFetch; },
              set: function(v) { origFetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch(e) {}
      })();
    </script>
